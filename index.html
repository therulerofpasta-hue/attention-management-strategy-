<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Management Strategy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>/*
VOICE: cozy, playful, generous — a cartoon desk garden for a five-minute break.
IDEA: a sunny recruiter's office desk seen head-on, like a picture-book spread.
PICTURE: window + wall + shelves + wooden desk with smiling pots; the plants are the game.
COLOUR and TYPE: forest green housing, sage wallpaper, honey wood, sunshine gold accent; Fredoka titles, Nunito body.
LAYOUT: HUD bar on top, the room as the hero, a sticky dock of five big buttons, drawers and modals over it.
*/
:root{color-scheme:light;--ink:#253427;--muted:#5d6b5c;--cream:#fffaf0;--paper:#fff4df;--wood:#c98a52;--woodd:#8a5a2b;--woodl:#e2ad74;--green:#2f6b4a;--leaf:#58b25b;--gold:#ffc928;--goldd:#a46d00;--pink:#ff8fab;--house:#1f4a38;--line:#e8d7b8}
:root[data-theme=dark],:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background-color:#173a2c;background:radial-gradient(circle at 20% 0%,#2e6a4f 0,#1f4a38 45%,#173a2c 100%) fixed;color:var(--ink);font:16px/1.5 Nunito,'Trebuchet MS',system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
h1,h2,h3,h4{font-family:Fredoka,'Trebuchet MS',sans-serif;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
.small{font-size:13px}.muted{color:var(--muted)}
.ic{flex:none;vertical-align:middle}
.app{max-width:1240px;margin:0 auto;padding:14px max(2vw,10px) 24px}

/* HUD */
.hud{position:sticky;top:8px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.3fr) auto;gap:14px;z-index:30;align-items:center;background:var(--cream);border-radius:24px;padding:12px 14px 12px 16px;box-shadow:0 6px 0 #0d2a1f,0 14px 30px rgba(0,0,0,.25)}
.brand{display:flex;gap:10px;align-items:center}
.brand h1{font-size:clamp(20px,2.4vw,30px);color:var(--green);letter-spacing:-.01em}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.counters{display:flex;gap:10px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px 14px 6px 8px;flex:1 1 150px}
.counter b{display:block;font-family:Fredoka,sans-serif;font-size:26px;line-height:1;color:#7a4c00;font-variant-numeric:tabular-nums}
.counter.gold b{color:#9a6a00}
.counter span{font-size:13px;color:var(--muted);white-space:nowrap}
.bump{animation:bump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35);color:#e08a00}100%{transform:scale(1)}}
.actions{display:flex;gap:10px;align-items:center}
.collect{position:relative;border:0;border-radius:22px;padding:10px 26px 12px;min-height:68px;background:linear-gradient(#ffe066,#ffb627);box-shadow:0 6px 0 #c47a00,0 10px 18px rgba(196,122,0,.35),inset 0 2px 0 #fff6b8;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.collect:hover{transform:translateY(-2px)}
.collect:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a00,0 4px 10px rgba(196,122,0,.3)}
.collect .ctitle{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;color:#6b3d00;letter-spacing:.02em;text-transform:uppercase;line-height:1.05}
.collect .csub{font-weight:800;font-size:14px;color:#7a4c00;white-space:nowrap;display:flex;gap:3px;align-items:center}
.collect.ready{animation:glowpulse 1.6s ease-in-out infinite}
.collect::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.2s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes glowpulse{50%{box-shadow:0 6px 0 #c47a00,0 0 0 8px rgba(255,214,74,.35),0 10px 26px rgba(255,180,0,.6),inset 0 2px 0 #fff6b8}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:10px 16px;min-height:44px;font-weight:800;background:#5fbf68;color:#fff;box-shadow:0 4px 0 #2f7d3a;transition:transform .1s,filter .1s}
.btn:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #2f7d3a}
.btn:disabled{background:#d8cfbf;color:#7d7262;box-shadow:0 4px 0 #b5aa96;cursor:default}
.btn .cost{background:rgba(255,255,255,.25);border-radius:10px;padding:1px 7px}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.warn{background:#ff8f6b;box-shadow:0 4px 0 #b9532f}
.btn.big{font-size:17px;padding:12px 22px}
.btn.sm{padding:6px 10px;min-height:36px;font-size:14px}
.btn.careall{background:#ff8fab;box-shadow:0 4px 0 #b84a6a}
.cost{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;font-weight:800}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px 6px;min-height:32px}

/* ROOM */
.room{position:relative;margin-top:14px;border-radius:28px;overflow:hidden;background-color:var(--wa);box-shadow:0 8px 0 #0d2a1f,0 20px 40px rgba(0,0,0,.3);padding-top:26px}
.room.wp-dots{background-image:radial-gradient(var(--wb) 3px,transparent 3.5px);background-size:28px 28px}
.room.wp-stripes{background-image:repeating-linear-gradient(90deg,var(--wa) 0 22px,var(--wb) 22px 44px)}
.room.wp-diamonds{background-image:linear-gradient(45deg,var(--wb) 25%,transparent 25%,transparent 75%,var(--wb) 75%),linear-gradient(45deg,var(--wb) 25%,transparent 25%,transparent 75%,var(--wb) 75%);background-size:36px 36px;background-position:0 0,18px 18px}
.room::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 40%,rgba(80,50,20,.08));pointer-events:none}
.wallrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px) minmax(0,1fr);align-items:center;gap:12px;padding:0 18px;position:relative;z-index:2}
.walldecor{display:flex;flex-direction:column;align-items:center;gap:14px}
.poster svg{width:78px;transform:rotate(-4deg);filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.frames{display:grid;gap:8px;justify-items:center}
.frames span{background:#fff8ec;border:4px solid #8a6a44;border-radius:4px;padding:6px 10px;font-family:Fredoka,sans-serif;font-size:13px;color:#6b4a2a;box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap}
.frames span:nth-child(2){transform:rotate(3deg)}.frames span:nth-child(3){transform:rotate(-2deg)}
.clock{width:70px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.garland{display:flex;gap:4px}.garland i{width:16px;height:20px;background:#ff8fab;clip-path:polygon(0 0,100% 0,50% 100%)}.garland i:nth-child(2n){background:#8fd3ff}.garland i:nth-child(3n){background:#ffd54a}
.stringlights{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-around;z-index:3;border-top:2px solid #4a5a3a;height:12px;border-radius:50%}
.stringlights i{width:9px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:3px;box-shadow:0 0 10px currentColor;animation:twk 2s ease-in-out infinite;color:#ffd54a}
@keyframes twk{50%{opacity:.45}}
.winwrap{position:relative}
.window{display:block;width:100%;border:0;background:none;padding:0;position:relative}
.winsvg{width:100%;display:block;filter:drop-shadow(0 6px 0 rgba(90,60,30,.18))}
.pane{transition:transform .9s cubic-bezier(.5,1.6,.4,1);transform-box:fill-box}
.pane.left{transform-origin:0 50%}.pane.right{transform-origin:100% 50%}
.window.open .pane.left{transform:perspective(400px) scaleX(.18) skewY(8deg)}
.window.open .pane.right{transform:perspective(400px) scaleX(.18) skewY(-8deg)}
.curtain{position:absolute;top:0;width:15%;height:94%;background:repeating-linear-gradient(90deg,#ff9fb5 0 10px,#ff86a1 10px 20px);border-radius:0 0 40% 40%;box-shadow:inset -4px 0 0 rgba(0,0,0,.08);transition:transform .9s cubic-bezier(.5,1.5,.4,1)}
.curtain.l{left:-6%;transform-origin:top left}.curtain.r{right:-6%;transform-origin:top right}
.window.open .curtain.l{transform:skewX(-3deg) translateX(-8%);animation:billowL 3.5s ease-in-out infinite}
.window.open .curtain.r{transform:skewX(3deg) translateX(8%);animation:billowR 3.5s ease-in-out infinite .5s}
@keyframes billowL{50%{transform:skewX(-6deg) translateX(-11%) scaleX(1.06)}}
@keyframes billowR{50%{transform:skewX(6deg) translateX(11%) scaleX(1.06)}}
.winhint{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);background:rgba(255,250,240,.92);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:800;color:#6b4a2a;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.1);transition:opacity .3s}
.window:hover .winhint{background:#fff}
.clouds{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
.treesway{animation:tsw 4s ease-in-out infinite}
@keyframes tsw{50%{transform:rotate(3deg)}}
.twinkle{animation:twk 2.4s ease-in-out infinite}
.planterbox{position:absolute;left:12%;right:12%;bottom:-6px;height:18px;background:#a8683a;border-radius:4px;border:2px solid #6b3a12;display:flex;justify-content:space-around;align-items:flex-start}
.planterbox i{width:14px;height:14px;margin-top:-12px;border-radius:50%;background:#ff8fab;box-shadow:0 0 0 3px #ffd0dc}
.planterbox i:nth-child(2n){background:#ffd54a;box-shadow:0 0 0 3px #fff0a8}
.rays{position:absolute;top:0;left:50%;width:min(860px,120%);height:100%;transform:translateX(-50%);pointer-events:none;z-index:4;opacity:.25;transition:opacity 1.2s}
.rays.on{opacity:1}
.rays i{position:absolute;top:60px;width:16%;height:110%;background:linear-gradient(180deg,rgba(255,240,170,.55),rgba(255,240,170,0) 85%);transform-origin:top center;filter:blur(2px);animation:ray 6s ease-in-out infinite;mix-blend-mode:screen}
.rays i:nth-child(1){left:30%;transform:rotate(18deg)}.rays i:nth-child(2){left:42%;transform:rotate(8deg);animation-delay:1.5s}.rays i:nth-child(3){left:54%;transform:rotate(-4deg);animation-delay:3s}.rays i:nth-child(4){left:64%;transform:rotate(-14deg);animation-delay:.8s;width:10%}
@keyframes ray{50%{opacity:.55}}
.breeze{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.breeze i{position:absolute;left:45%;width:14px;height:9px;background:#7cc36b;border-radius:0 100% 0 100%;animation:breeze 8s linear infinite;opacity:0}
@keyframes breeze{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(48vw,30vh) rotate(720deg);opacity:0}}
.breeze i:nth-child(2n){animation-name:breeze2;background:#ffb3c7}
@keyframes breeze2{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(-44vw,34vh) rotate(-600deg);opacity:0}}

.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;justify-items:center;position:relative;z-index:5}
.shelf{position:relative;margin:18px 18px 0;z-index:5}
.shelf .slots{padding:0 10px}
.plank{height:16px;background:linear-gradient(var(--sl),var(--sm));border-radius:6px;border:2px solid var(--sd);box-shadow:0 8px 0 rgba(60,30,10,.18);margin-top:-12px;position:relative}
.plank::before,.plank::after{content:'';position:absolute;top:12px;width:12px;height:22px;background:var(--sd);border-radius:0 0 4px 4px}
.plank::before{left:12%}.plank::after{right:12%}
.desk{position:relative;margin-top:22px;display:grid;grid-template-columns:110px minmax(0,1fr) 110px;align-items:end;z-index:5}
.desk .slots{padding:0 4px}
.desktop{grid-column:1/-1;height:26px;background:linear-gradient(var(--woodl),var(--wood));border-top:3px solid var(--woodl);filter:saturate(1.05);border-bottom:3px solid var(--woodd);margin-top:-16px;position:relative;z-index:1}
.deskfront{grid-column:1/-1;height:62px;background:repeating-linear-gradient(90deg,var(--woodf) 0 60px,var(--woodd) 60px 62px);display:flex;justify-content:center;gap:24px;align-items:center;border-bottom:4px solid var(--woodd)}
.drawer{width:min(200px,30%);height:36px;background:var(--wood);border:3px solid var(--woodd);border-radius:6px;position:relative}
.drawer::after{content:'';position:absolute;left:50%;top:50%;width:34px;height:7px;margin:-3.5px 0 0 -17px;background:var(--woodl);border-radius:4px;border:2px solid var(--woodd)}
.deskprops{display:flex;align-items:flex-end;justify-content:center;gap:6px;padding-bottom:10px;position:relative;z-index:2;height:100%}
.mug{width:34px;height:38px;background:#fff;border:3px solid #6b4a2a;border-radius:4px 4px 10px 10px;position:relative}
.mug::after{content:'';position:absolute;right:-13px;top:7px;width:12px;height:16px;border:3px solid #6b4a2a;border-left:0;border-radius:0 10px 10px 0}
.mug::before{content:'';position:absolute;inset:6px 4px auto;height:8px;background:#ff8fab;border-radius:4px}
.steam{position:absolute;left:30%;top:-26px;width:8px;height:22px;border-left:3px solid rgba(255,255,255,.9);border-radius:50%;animation:steam 2.6s ease-in-out infinite}
.steam+.steam{left:60%;animation-delay:1.2s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-12px) scaleX(-1)}}
.papers{width:44px;height:12px;background:#fff;border:2px solid #b8a68a;border-radius:2px;box-shadow:3px -4px 0 #f6efe0,3px -4px 0 2px #b8a68a;transform:rotate(-6deg)}
.coffee{width:48px;height:60px;background:linear-gradient(#5b6b7b,#3b4a59);border-radius:8px 8px 4px 4px;position:relative;border:3px solid #23303b}
.coffee::before{content:'';position:absolute;left:10px;right:10px;bottom:4px;height:18px;background:#fff;border-radius:0 0 6px 6px;border:2px solid #23303b}
.coffee::after{content:'';position:absolute;left:8px;top:8px;width:10px;height:10px;border-radius:50%;background:#8be38f;box-shadow:16px 0 0 #ff8fab}
.lamp{width:64px;height:110px;position:relative}
.lamp::before{content:'';position:absolute;bottom:0;left:16px;width:34px;height:10px;background:#3b4a59;border-radius:6px}
.lamp::after{content:'';position:absolute;bottom:8px;left:30px;width:6px;height:80px;background:#3b4a59;transform:rotate(-14deg);transform-origin:bottom}
.lamp i{position:absolute;top:2px;left:-6px;width:56px;height:30px;background:var(--lamp,#ffcf4a);border:3px solid var(--lampd,#a46d00);border-radius:30px 30px 6px 6px;transform:rotate(-24deg);z-index:1;box-shadow:0 18px 30px rgba(255,220,100,.7)}
.caddy{width:36px;height:34px;background:#a5d66f;border:3px solid #3b6b1f;border-radius:4px 4px 8px 8px;position:relative}
.caddy::before{content:'';position:absolute;left:4px;right:4px;top:-12px;height:12px;border:3px solid #3b6b1f;border-bottom:0;border-radius:10px 10px 0 0}
.floor{height:64px;background:repeating-linear-gradient(90deg,#9a6438 0 90px,#8f5c33 90px 92px);position:relative;display:flex;justify-content:center;align-items:flex-end}
.rug{position:absolute;left:18%;right:18%;bottom:8px;height:40px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,#ff9fb5 0 10px,#ffd0dc 10px 20px,#8fd3ff 20px 28px);border:3px solid #b84a6a;opacity:.95}
.cat{position:absolute;bottom:6px;left:calc(50% - 60px);width:120px;z-index:2}
.cathead{animation:breathe 4s ease-in-out infinite;transform-origin:92px 48px}
.cattail{animation:tail 3s ease-in-out infinite;transform-origin:22px 44px}
@keyframes tail{50%{transform:rotate(-12deg)}}
@keyframes breathe{50%{transform:translateY(1.5px)}}
.zzz{animation:zz 3s ease-in-out infinite;font-family:Fredoka,sans-serif}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}

/* PLANT CELLS */
.cell{width:100%;position:relative;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0 0 4px;border-radius:18px;transition:transform .15s}
.cell:hover{transform:translateY(-3px)}
.cell:hover .artwrap{filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
.cell.sel .artwrap{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 10px #fff3a8) drop-shadow(0 0 4px #ffd54a)}
.artwrap{display:block;width:100%;max-width:200px;aspect-ratio:140/214;transition:filter .2s}
.artwrap.sm{max-width:90px}.artwrap.lg{max-width:200px}
.plantsvg{width:100%;height:100%;display:block;overflow:visible}
.sway{transform-origin:70px 150px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
.bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{50%{transform:rotate(8deg) scale(1.05)}}
.coinspin{animation:coinspin 2.4s ease-in-out infinite}
@keyframes coinspin{0%,60%,100%{transform:scaleX(1)}80%{transform:scaleX(.2)}}
.mote{animation:mote 3s ease-in-out infinite}
@keyframes mote{0%{opacity:0;transform:translateY(10px)}50%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.clabel{font-size:12px;font-weight:800;line-height:1.15;text-align:center;background:rgba(255,250,240,.9);border-radius:10px;padding:2px 7px;margin-top:-6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:2}
.clabel i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.clabel.muted{color:var(--muted)}
.cstage{font-size:11px;color:#3b4a35;font-weight:700;position:relative;padding-bottom:3px;background:rgba(255,250,240,.7);border-radius:8px;padding:0 6px 3px;margin-top:2px;z-index:2}
.cstage em{position:absolute;left:6px;bottom:0;height:3px;background:#58b25b;border-radius:2px;max-width:calc(100% - 12px)}
.pend{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:#fff;border:2px solid #ffc928;color:#7a4c00;font-weight:900;font-size:12px;border-radius:999px;padding:1px 8px;white-space:nowrap;animation:popin .4s cubic-bezier(.3,1.8,.5,1);box-shadow:0 2px 0 #e0a800;display:flex;align-items:center;gap:2px}
.pend b{color:#9a6a00}
@keyframes popin{from{transform:translateX(-50%) scale(.6)}to{transform:translateX(-50%) scale(1)}}
.buffs{position:absolute;top:16%;right:4%;display:flex;flex-direction:column;gap:2px;z-index:3;background:rgba(255,255,255,.85);border-radius:10px;padding:2px}
.cell.empty .artwrap{opacity:.85}
.cell.fx-rotate .artwrap{animation:spinY .8s ease-in-out}
@keyframes spinY{50%{transform:scaleX(-1)}}
.cell.fx-trim .artwrap{animation:snip .5s ease-in-out 2}
@keyframes snip{50%{transform:scale(1.04,.97)}}
.cell.fx-water .artwrap{animation:stretch .9s ease-out}
@keyframes stretch{40%{transform:scaleY(1.06)}}
.cell.fx-fert .artwrap{filter:drop-shadow(0 0 10px #a5ff7a)}
.cell.fx-light .artwrap{filter:drop-shadow(0 0 14px #ffe066) brightness(1.1)}
.cell.fx-levelup .artwrap{animation:levelup .8s cubic-bezier(.3,1.8,.5,1)}
@keyframes levelup{40%{transform:scale(1.12)}}
.carefx{position:absolute;inset:0;pointer-events:none;z-index:4}
.carefx .p{position:absolute;top:20%}
.p.water{width:8px;height:11px;background:#5bb8f0;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid #1d5f8f;animation:fall .9s ease-in forwards;opacity:0}
@keyframes fall{0%{opacity:0;transform:translateY(-20px)}20%{opacity:1}100%{opacity:0;transform:translateY(90px)}}
.p.trim,.p.levelup{width:12px;height:12px;background:#ffd54a;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:sparkle .9s ease-out forwards;opacity:0}
.p.levelup{background:#fff3a8;top:35%}
@keyframes sparkle{0%{opacity:0;transform:scale(0) rotate(0)}40%{opacity:1;transform:scale(1.4) rotate(90deg)}100%{opacity:0;transform:scale(.4) translateY(-30px) rotate(180deg)}}
.p.fert{width:8px;height:8px;border-radius:50%;background:#8be38f;border:1.5px solid #2f7d3a;top:60%;animation:rise 1.1s ease-out forwards;opacity:0}
.p.light{width:10px;height:10px;border-radius:50%;background:#ffe066;box-shadow:0 0 10px #ffe066;top:30%;animation:rise 1.1s ease-out forwards;opacity:0}
.p.rotate{width:7px;height:7px;border-radius:50%;background:#9be5c3;top:50%;animation:rise 1s ease-out forwards;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.lvtxt{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-family:Fredoka,sans-serif;font-weight:700;color:#fff;-webkit-text-stroke:1px #6b3d00;font-size:18px;white-space:nowrap;animation:lvt 1.3s ease-out forwards;text-shadow:0 2px 0 #c47a00}
@keyframes lvt{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-26px)}}

/* DOCK */
.dock{position:sticky;bottom:10px;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px;background:var(--cream);border-radius:22px;padding:8px;box-shadow:0 6px 0 #0d2a1f,0 14px 30px rgba(0,0,0,.3)}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:#fff;border-radius:16px;padding:8px 4px;min-height:64px;font-weight:800;font-size:14px;box-shadow:0 4px 0 var(--line);transition:transform .12s}
.dock button:hover{transform:translateY(-2px);background:#fffdf6}
.dock button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dock span{line-height:1.15;text-align:center}
.badge{position:absolute;top:4px;right:10%;background:#ff5d7a;color:#fff;font-style:normal;font-size:12px;font-weight:900;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;border:2px solid #fff;animation:bump 1.6s ease-in-out infinite}
.dot{position:absolute;top:8px;right:16%;width:12px;height:12px;border-radius:50%;background:#8b6cff;border:2px solid #fff}
.foot{color:#cfe8d9;font-size:13px;text-align:center;margin:14px 0 0}

/* PANEL & MODALS */
.panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(400px,calc(100vw - 24px));background:var(--cream);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.4);z-index:40;overflow-y:auto;padding:18px;animation:slidein .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}}
.xbtn{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:#f0e4cc;display:grid;place-items:center;z-index:2}
.xbtn:hover{background:#ead8b6}
.phead{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding-right:40px}
.pbig{width:120px}
.phead h3{font-size:22px;margin:6px 0 2px}
.chip{display:inline-block;color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 10px;background:#7c8b6f}
.chip.sm{font-size:11px;padding:1px 8px}
.stagebar{margin:12px 0}
.bar{position:relative;height:12px;background:#efe3cc;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7ad06f,#3fae5a);border-radius:999px;transition:width .3s}
.bar b{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.8)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:6px}
.pstats>div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px}
.pstats b{display:flex;align-items:center;gap:4px;font-family:Fredoka,sans-serif;font-size:18px}
.pstats span{display:block}
.panel h4,.mbody h4{font-size:17px;margin:14px 0 8px;color:var(--green)}
.caregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.carebtn{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 10px;min-height:56px;box-shadow:0 3px 0 var(--line);overflow:hidden;transition:transform .1s}
.carebtn .ic{grid-row:1/3}
.carebtn b{font-size:15px}
.carebtn .small{color:var(--muted);line-height:1.2}
.carebtn .act{color:#2f7d3a;font-weight:800;grid-column:2}
.carebtn:not(:disabled):hover{transform:translateY(-1px);border-color:#9fd38f}
.carebtn:not(:disabled):active{transform:translateY(2px)}
.carebtn:disabled{cursor:default}
.carebtn:disabled::after{content:'';position:absolute;inset:0;background:rgba(240,228,204,.65);transform-origin:left;transform:scaleX(var(--cd,1))}
.carebtn.active{background:#effbe8;border-color:#9fd38f}
.carebtn.tonic{background:#fff9e0}
.genome{width:100%;border-collapse:collapse;font-size:14px}
.genome th{text-align:left;font-weight:700;color:var(--muted);padding:5px 6px 5px 0;width:40%;vertical-align:top}
.genome td{padding:5px 0;border-bottom:1px dashed var(--line)}
.alle{display:inline-flex;gap:4px;margin-left:6px;flex-wrap:wrap}
.alle i{font-style:normal;font-size:11px;background:#f0e4cc;border-radius:6px;padding:0 5px;color:#6b5a3a}
.alle i.dom{background:#d8f0cc;color:#2f6b2a;font-weight:800}
.hue{display:inline-flex;align-items:center;gap:6px}.hue i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc}
.qbar{display:inline-flex;align-items:center;gap:6px;width:100%}
.qbar i{height:8px;background:#7ad06f;border-radius:4px;flex:none;max-width:70%}
.qbar em{font-style:normal;font-size:12px;color:var(--muted)}
.prow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

.scrim{position:fixed;inset:0;background:rgba(15,40,30,.55);z-index:50;display:grid;place-items:center;padding:12px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--cream);border-radius:26px;width:min(720px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;box-shadow:0 8px 0 #0d2a1f,0 30px 60px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.3,1.5,.5,1);position:relative}
.modal.wide{width:min(940px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 64px 12px 18px;border-bottom:2px dashed var(--line)}
.mhead h2{font-size:26px;color:var(--green)}
.mbody{overflow-y:auto;padding:12px 18px 20px}
.note{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin:4px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:17px}
.card p{margin:0;flex:1;color:#4a5848}
.card.owned{background:#f1faea;border-color:#bfe3ad}
.cardart{display:grid;place-items:center;background:#fff6e2;border-radius:12px;padding:6px}
.pickrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick{position:relative;background:#fff;border:3px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pick.on{border-color:#8b6cff;background:#f3efff}
.pick .tag{position:absolute;top:6px;left:6px;background:#8b6cff;color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:13px}
.cross{margin-top:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.cross h4{margin-top:0}
.odds{display:grid;gap:6px;margin-bottom:12px}
.oddrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px;align-items:center}
.olab{font-weight:700;font-size:14px;color:var(--muted)}
.obar{display:flex;gap:3px;border-radius:10px;overflow:hidden}
.obar i{font-style:normal;font-size:12px;background:#e7f6df;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-basis:0}
.obar i:nth-child(2){background:#efe7ff}.obar i:nth-child(3){background:#fff1d6}.obar i:nth-child(4){background:#ffe6ec}
.reveal{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center;margin-top:12px;background:linear-gradient(135deg,#fff8dc,#f3efff);border-radius:20px;padding:14px;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.reveal h3{font-size:24px;margin:6px 0}
.mut{color:#8b3fd6;font-weight:800}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:800;min-height:40px}
.tabs button.on{background:var(--green);border-color:var(--green);color:#fff}
.tgroup{margin-bottom:6px}
.trow{display:flex;flex-wrap:wrap;gap:8px}
.trait{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 4px}
.trait.unk{opacity:.75;background:#f6efe2}
.ticon{width:44px;height:44px}
.specgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.spec{background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.how p{max-width:68ch}
.shift{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.shift.ready{background:linear-gradient(135deg,#fff8dc,#ffeccc);border-color:#ffc928}
.shift p{margin:4px 0 0;max-width:46ch}
.reqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.req{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px}
.req.done{border-color:#7ad06f;background:#f1faea;animation:glowg 2s ease-in-out infinite}
@keyframes glowg{50%{box-shadow:0 0 0 4px rgba(122,208,111,.3)}}
.req p{margin:0;font-weight:700}
.reqtop{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.reqfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.reward{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.miles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-bottom:12px}
.mile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.mile b,.mile span{display:block}
.mile.locked{opacity:.7}
.mile.ready{border-color:#ffc928;background:#fff8dc}
.mile.done .medal{background:#7ad06f;color:#fff}
.medal{width:32px;height:32px;border-radius:50%;background:#f0e4cc;display:grid;place-items:center}
.wps{display:flex;flex-wrap:wrap;gap:8px}
.wpb{border:3px solid var(--line);border-radius:14px;min-height:56px;min-width:96px;font-weight:800}
.wpb.on{border-color:var(--green)}

/* FEEDBACK */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.fly{position:fixed;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b8,#ffc928 45%,#e09500);border:2px solid #9a6400;box-shadow:0 0 12px rgba(255,214,74,.9)}
.fly.gleaf{border-radius:0 100% 0 100%;background:linear-gradient(135deg,#fff3a8,#ffd54a 50%,#d99a00);border-color:#8a6200}
.spark{position:fixed;left:-5px;top:-5px;width:10px;height:10px;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.bigpop{position:fixed;left:50%;top:38%;z-index:95;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;animation:bigpop 2.2s cubic-bezier(.3,1.6,.5,1) forwards}
.bigpop b{font-family:Fredoka,sans-serif;font-weight:700;font-size:clamp(40px,8vw,84px);color:#ffe066;-webkit-text-stroke:3px #7a4500;paint-order:stroke fill;text-shadow:0 6px 0 #c47a00,0 12px 30px rgba(0,0,0,.35);white-space:nowrap;letter-spacing:.01em}
.bigpop span{display:flex;align-items:center;gap:6px;font-family:Fredoka,sans-serif;font-size:clamp(20px,3.4vw,32px);font-weight:700;color:#fff;background:#2f6b4a;border-radius:999px;padding:4px 16px;box-shadow:0 4px 0 #173a2c}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-60%)}100%{opacity:0;transform:translate(-50%,-75%)}}
.toasts{position:fixed;right:16px;bottom:100px;display:flex;flex-direction:column;gap:6px;z-index:80;width:min(360px,calc(100vw - 24px));pointer-events:none}
.toast{background:#fffaf0;border-radius:16px;padding:9px 14px;box-shadow:0 4px 0 rgba(0,0,0,.15),0 10px 24px rgba(0,0,0,.25);animation:toast .4s cubic-bezier(.3,1.6,.5,1);border-left:6px solid #c9b48c}
.toast b{display:block}.toast span{font-size:13px;color:var(--muted)}
.toast.t-good{border-left-color:#58b25b}.toast.t-disc{border-left-color:#8b6cff;background:#f8f5ff}.toast.t-mile{border-left-color:#ffc928;background:#fffbe8}
@keyframes toast{from{transform:translateY(20px) scale(.9);opacity:0}}
.away{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:60;width:min(560px,calc(100vw - 24px));background:var(--cream);border-radius:24px;padding:16px 56px 16px 18px;box-shadow:0 8px 0 #0d2a1f,0 24px 50px rgba(0,0,0,.4);display:flex;gap:14px;align-items:center;flex-wrap:wrap;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.away h3{font-size:24px;color:var(--green)}
.away p{margin:4px 0 0}
.away>div{flex:1 1 260px}

@media (max-width:900px){
  .hud{grid-template-columns:minmax(0,1fr) auto}
  .counters{grid-column:1/-1;order:3}
  .wallrow{grid-template-columns:minmax(0,70px) minmax(0,1fr) minmax(0,70px);padding:0 8px}
  .poster svg{width:56px}.clock{width:54px}.frames span{font-size:11px;padding:4px 6px;white-space:normal}
  .desk{grid-template-columns:60px minmax(0,1fr) 60px}
  .lamp{transform:scale(.7);transform-origin:bottom}.coffee,.mug{transform:scale(.8);transform-origin:bottom}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:600px){
  .hud{grid-template-columns:1fr;padding:12px;position:relative;top:0}
  .brand p{display:none}
  .actions{justify-content:stretch}.collect{flex:1}
  .counter b{font-size:22px}
  .wallrow{grid-template-columns:minmax(0,1fr);padding:0 8%}
  .walldecor{display:none}
  .desk{grid-template-columns:minmax(0,1fr)}
  .deskprops{display:none}
  .shelf{margin:16px 6px 0}
  .dock{gap:4px;padding:6px}.dock button{font-size:11px;min-height:58px;padding:6px 2px}.dock .ic{width:26px;height:26px}
  .reveal{grid-template-columns:1fr;justify-items:center;text-align:center}
  .oddrow{grid-template-columns:1fr}
  .phead{grid-template-columns:90px minmax(0,1fr)}.pbig{width:90px}
  .panel{top:auto;left:8px;right:8px;width:auto;max-height:78vh;border-radius:24px 24px 18px 18px;animation:slideup .35s cubic-bezier(.3,1.3,.5,1)}
  .toasts{bottom:84px;right:12px}
  .toast:nth-last-child(n+3){display:none}
  .collect .ctitle{font-size:21px}
  .collect{padding:8px 14px 10px;min-height:60px}
  .counter span{white-space:normal;font-size:12px}
  .away{top:auto;bottom:90px}
}
@keyframes slideup{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* progression & customization */
.nextu{grid-column:span 2;min-width:220px;display:flex;flex-direction:column;justify-content:center;gap:3px;background:#f3ecdc;border:2px dashed #c9b48c;border-radius:16px;padding:8px 12px;min-height:64px}
.nextu b{font-family:Fredoka,sans-serif;font-weight:600;color:var(--green)}
.nextu .bar{height:8px;margin-top:2px}
.dock{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.window.locked{cursor:default}
.window.locked .winhint{background:rgba(240,228,204,.95);color:#7d6a4a}
.logs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.logbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px 12px;min-height:72px;text-align:left;box-shadow:0 3px 0 var(--line);transition:transform .1s}
.logbtn:not(:disabled):hover{transform:translateY(-2px);border-color:#9fd38f}
.logbtn:not(:disabled):active{transform:translateY(2px)}
.logbtn:disabled{opacity:.6;cursor:default}
.logbtn b{font-family:Fredoka,sans-serif;font-size:17px;font-weight:600}
.logbtn em{font-style:normal;color:var(--muted)}
.lg-sub{background:#f3efff}.lg-interview{background:#eef7ff}.lg-place{background:linear-gradient(135deg,#fff8dc,#ffeccc);border-color:#ffc928}
.chip.rec{background:#2f7fd1}.chip.gar{background:#3d9a5b}
.potrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{border:2px solid var(--line);background:#fff;border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center;padding:3px}
.sw.on{border-color:var(--green);box-shadow:0 0 0 2px #bfe3ad}
.dotsw{display:block;width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.2)}
.dotsw.sq{border-radius:8px;width:44px;height:34px}
.cust .cardart{min-height:70px}.cust .dotsw{width:48px;height:48px}.cust .dotsw.sq{width:72px;height:52px}.cust .cardart svg{width:72px;height:58px}
.cust{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.rename{display:flex;gap:6px;margin:6px 0 2px}.rename input{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;min-width:0;flex:1}
.phead h3 .link{font-family:Nunito,sans-serif;font-size:12px;font-weight:700}
.species{margin:0;font-weight:700;color:var(--green);font-size:14px}
.traitline{margin:0 0 4px;font-weight:700}
.link.light{color:#cfe8d9}
.unlockm{width:min(420px,100%);padding:26px 24px;text-align:center;align-items:center;gap:10px}
.unlockm h2{font-size:32px;color:var(--green)}.unlockm p{margin:0;max-width:34ch}
.unlockm .chip{background:#ffb627;color:#6b3d00;font-size:14px}
@media (max-width:600px){.nextu{grid-column:1/-1}.dock{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* alien & rare effects */
.floaty{animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-3px)}}
.floaty:nth-child(2n){animation-delay:-1.4s}
.tent{animation:curl 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes curl{50%{transform:rotate(9deg) scaleY(1.06)}}
.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.25);opacity:.8}}
.biolum{animation:twk 2.2s ease-in-out infinite}
.ticon.tplant{display:block;width:44px;height:60px}

/* stars, goal tracker, reveal */
.stars{color:#f2a900;letter-spacing:-1px;font-size:13px;white-space:nowrap;text-shadow:0 1px 0 #8a5d00}
.stars em{font-style:normal;color:#d9cdb5;text-shadow:none}
.stars.s5{color:#ff9d00;text-shadow:0 0 6px #ffd54a}
.cstage .stars{font-size:11px}
.genechips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.genechips i{font-style:normal;font-size:11px;font-weight:800;background:#efe7ff;color:#4b3a8a;border-radius:8px;padding:1px 6px}
.genechips i.hot{background:linear-gradient(90deg,#ffe6f3,#e6f6ff);color:#8b2b8a;box-shadow:0 0 0 1px #e3b6f0}
.panel .genechips{justify-content:flex-start}
.goalband{margin-top:14px;background:var(--cream);border-radius:22px;padding:14px 18px;box-shadow:0 6px 0 #0d2a1f,0 14px 30px rgba(0,0,0,.25)}
.goalband.done{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gtitle{display:flex;align-items:center;gap:10px}
.gtitle h2{font-size:22px;color:var(--green);flex:1}
.gtitle .chip{background:#ffb627;color:#6b3d00}
.gpct{font-family:Fredoka,sans-serif;font-weight:700;font-size:20px;color:#7a4c00}
.bar.big{height:14px;margin:8px 0 10px}
.greqs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 16px}
.greqs li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.greqs li.ok .glab{text-decoration:line-through;color:var(--muted)}
.gtick{width:20px;height:20px;border-radius:50%;border:2px solid #c9b48c;display:grid;place-items:center;flex:none}
.greqs li.ok .gtick{background:#58b25b;border-color:#58b25b;color:#fff}
.glab{font-weight:700}
.gwhy{margin:8px 0 0;font-size:14px;color:#4a5848}
.pick .genechips{margin-top:2px}
.planted{margin-top:12px;background:#f1faea;border-color:#bfe3ad}
.revealm{width:min(460px,100%);padding:22px;align-items:center;text-align:center;gap:6px;overflow-y:auto}
.revealm h2{font-size:28px;color:var(--green)}
.revealm .artwrap.lg{max-width:180px;animation:grow-in 1s cubic-bezier(.3,1.5,.5,1)}
@keyframes grow-in{from{transform:scale(.3);opacity:0}}
.revealm.s4{background:linear-gradient(160deg,#fffaf0,#f3ecff)}
.revealm.s5{background:radial-gradient(circle at 50% 30%,#fff6c2,#ffe6a0 40%,#fffaf0 75%);box-shadow:0 0 0 4px #ffc928,0 0 60px rgba(255,200,40,.8),0 30px 60px rgba(0,0,0,.4)}
.bigstars{display:flex;gap:4px;font-size:38px;line-height:1}
.bigstars span{color:#e3d8c2;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
.bigstars span.on{color:#ffb300;text-shadow:0 2px 0 #a46d00,0 0 14px rgba(255,200,40,.8)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}}
.jackpot{font-family:Fredoka,sans-serif;font-weight:700;font-size:26px;color:#fff;background:linear-gradient(90deg,#ff5d7a,#ffb627,#8be38f,#5bb8f0,#b28bff);border-radius:999px;padding:4px 18px;animation:bump 1.2s ease-in-out infinite;-webkit-text-stroke:1px #6b3d00}
.hof{border-color:#d9c3ff}.hof.s5{border-color:#ffc928;background:linear-gradient(#fff8dc,#fff)}
.greqs li{display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:8px;align-items:center}
.greqs li>.small{grid-column:2/-1}
